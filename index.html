<head>

<title>Mickey T Welding &amp; Fabrication</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Core layout: charcoal sidebar on laptop, bottom tabs on phone, light working surfaces. */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --fg:#20252B; --muted:#59636F; --line:#D9DEE5;
  --accent:#B94D0A; --on-accent:#FFFFFF; --orange:#D96614; --gold:#F2A15F; --soft:#EEF1F4; --soft-fg:#38414A;
  --side:#202329; --side-fg:#F5F6F7; --side-muted:#B7BEC7;
  --good:#1f7a3f; --good-bg:#e4f3e8; --warn:#8a5a00; --warn-bg:#fdf0cf; --bad:#b3261e; --bad-bg:#fbe6e3;
  --shadow:0 1px 2px rgba(32,37,43,.08);
  --display:Archivo,"Arial Black",Arial,sans-serif;
  --body:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* sidebar */
.side{width:226px;flex:0 0 auto;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:4px;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.brand img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.brand b{font-family:var(--display);font-size:19px;color:#fff;line-height:1}
.brand small{display:block;font-size:12px;color:var(--gold);margin-top:3px}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;border:0;background:none;color:var(--side-fg);font-weight:600;font-size:14px;text-align:left;width:100%;min-height:44px}
.nav svg{width:18px;height:18px;flex:0 0 auto}
.nav.on{background:var(--orange);color:#fff}
.nav .n{margin-left:auto;background:rgba(255,255,255,.16);border-radius:99px;padding:0 8px;font-size:12px}
.nav.on .n{background:rgba(40,24,15,.2)}
.side .call{margin-top:auto}
/* main */
.main{flex:1;min-width:0;overflow-y:auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14px;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.big{min-height:54px;font-size:16px;width:100%}
.btn svg{width:17px;height:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;min-width:0}
.tile .big-n{font-family:var(--display);font-size:38px;line-height:1;min-width:30px}
.tile b{display:block;font-size:14px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.hot{background:var(--side);border-color:var(--side);color:#fff}
.tile.hot .big-n{color:var(--gold)} .tile.hot span{color:var(--side-muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.jc{display:flex;flex-direction:column;gap:8px;border:0;background:none;padding:0;text-align:left;min-width:0}
.ph{aspect-ratio:4/3;border-radius:12px;background:var(--soft) center/cover no-repeat;position:relative;width:100%;max-width:100%;display:flex;align-items:center;justify-content:center;color:var(--soft-fg);font-weight:600;font-size:13px;box-shadow:0 1px 2px rgba(40,24,15,.15)}
.jc b{font-size:14px;line-height:1.25;display:block}
.jc span.s{font-size:13px;color:var(--muted);display:block;line-height:1.3}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--soft);color:var(--soft-fg)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.ph .pill{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.need{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;text-align:left;width:100%;min-height:56px}
.need .ic{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--soft-fg);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.need .ic svg{width:17px;height:17px}
.need .t{flex:1;min-width:0}
.need b{display:block;font-size:14px} .need span{font-size:13px;color:var(--muted)}
.need .go{font-weight:700;color:var(--accent);font-size:13px;white-space:nowrap}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{flex:0 0 232px;max-width:82vw;scroll-snap-align:start;background:var(--soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.col.over{outline:2px dashed var(--orange)}
.col h3{display:flex;justify-content:space-between;align-items:baseline;color:var(--soft-fg)}
.col h3 small{font-family:var(--body);font-size:12px;font-weight:600}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:var(--shadow)}
.kc .ph{aspect-ratio:16/9;border-radius:8px;box-shadow:none}
.kc b{font-size:13.5px;line-height:1.2} .kc span{font-size:12.5px;color:var(--muted);line-height:1.25}
.empty{font-size:13px;color:var(--soft-fg);opacity:.8;padding:6px 2px}
/* panels */
.panel{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{aspect-ratio:16/8;border-radius:14px;background:var(--soft) center/cover no-repeat;max-width:100%}
.steps{display:flex;gap:4px}
.steps span{flex:1;text-align:center;font-size:11px;font-weight:700;padding:7px 2px;border-radius:7px;background:var(--soft);color:var(--soft-fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps span.done{background:var(--fg);color:var(--bg)} .steps span.now{background:var(--orange);color:#fff}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs div{aspect-ratio:1;border-radius:10px;background:var(--soft) center/cover no-repeat}
.thumbs label{aspect-ratio:1;border-radius:10px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center}
.tl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl time{font-size:12.5px;color:var(--muted);font-weight:600}
.tl small{display:block;color:var(--muted);font-size:12px}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px 11px;min-height:44px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
/* quote builder */
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,.9fr) minmax(0,.9fr) 96px 40px;gap:8px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.line .amt{font-weight:700;text-align:right;padding-bottom:11px}
.line .x{min-height:44px;border:0;background:none;color:var(--muted);font-size:20px;border-radius:9px}
.kind{font-size:11.5px;font-weight:700;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--fg);padding-top:12px}
.total b{font-family:var(--display);font-size:34px}
/* document */
.doc{max-width:760px;margin:0 auto;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:18px}
.doc-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.doc-top img{width:74px;height:74px;border-radius:50%}
.doc-top .co{display:flex;gap:14px;align-items:center}
.doc-kind{font-family:var(--display);font-size:34px;color:var(--accent);text-align:right}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);border-bottom:2px solid var(--fg);padding:8px 6px}
td{padding:9px 6px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-height:56px}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li b{display:block} .li span.s{font-size:13px;color:var(--muted)}
.li .th{width:52px;height:52px;border-radius:10px;background:var(--soft) center/cover no-repeat;flex:0 0 auto}
.note{background:var(--soft);color:var(--soft-fg);border-radius:10px;padding:10px 12px;font-size:13px}
pre{margin:0;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;user-select:all}
/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(20,12,7,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.sheet{background:var(--surface);color:var(--fg);border-radius:18px;padding:20px;width:min(520px,100%);max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--side);color:#fff;border-radius:99px;padding:11px 18px;font-weight:600;font-size:14px;z-index:40;box-shadow:var(--shadow);max-width:90%}
/* phone */
.tabs{display:none}
@media (max-width:820px){
  .side{display:none}
  .main{padding-block:16px 96px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--side);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
  .tabs button{border:0;background:none;color:var(--side-muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;min-height:50px;justify-content:center;border-radius:10px}
  .tabs svg{width:21px;height:21px}
  .tabs button.on{color:var(--gold)}
  .tabs button.callb{background:var(--orange);color:#fff}
  .tiles{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  h1{font-size:26px}
  .line{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px}
  .line .d{grid-column:1 / -1}
  .line .amt{grid-column:1 / 3;text-align:left;padding-bottom:0}
  .doc{padding:18px}
  .hero{aspect-ratio:4/3}
}

/* Mickey T workspace colours and type. */
:root{--bg:#F4F6F8;--surface:#FFFFFF;--fg:#20252B;--muted:#59636F;--line:#D9DEE5;--accent:#B94D0A;--on-accent:#FFFFFF;--orange:#D96614;--gold:#F2A15F;--soft:#EEF1F4;--soft-fg:#38414A;--side:#202329;--side-fg:#F5F6F7;--side-muted:#B7BEC7;--good:#1f7a3f;--good-bg:#e4f3e8;--warn:#8a5a00;--warn-bg:#fdf0cf;--bad:#b3261e;--bad-bg:#fbe6e3;--shadow:0 1px 2px rgba(32,37,43,.08);}

function needs(){

    if(j.status==='quote'&&!q)out.push({ic:'call',b:c,s:j.title+'. Needs a quote.',go:'Start quote',act:'quote',id:j.id});
    else if(j.status==='quote'&&q.status==='draft')out.push({ic:'quotes',b:c,s:j.title+'. Quote started, not sent.',go:'Finish quote',act:'quote',id:j.id});
    else if(j.status==='quote'&&q.status==='sent')out.push({ic:'quotes',b:c,s:j.title+'. Waiting on a yes.',go:'Open',act:'quotedoc',id:j.id});

    }
  });
  invoicePreparationQueue().forEach(entry=>{const j=job(entry.jobId),v=entry.kind==='invoice'?S.invoices.find(invoice=>invoice.id===entry.id):null,q=quoteOf(j.id),needsPricing=!v&&!q&&sum(j.lines||[])<=0;out.push({ic:'invoices',b:cust(j.c).name,s:j.title+'. '+(v?(invoiceTypeLabel(v)+(' draft is ready to prepare. '+invoicePaymentTiming(v).label+'.')):needsPricing?'Completed repair needs work pricing before an invoice can be prepared.':q?'Approved quote is ready to prepare.':'Agreed work is ready to invoice.'),go:needsPricing?'Add work pricing':'Prepare invoice',act:v?'prepareinv':needsPricing?'workpricing':'mkinv',id:entry.id})});

function makeInvoice(jid){
  const j=job(jid), q=quoteOf(jid);
  if(!j)throw new Error('Job not found.');
  if(j.billingVersion===2){
    const existing=invoicesForJob(jid);if(existing.length){const invoice=existing[0];if(!invoiceIsPrepared(invoice))prepareInvoiceForReview(invoice.id);go('invdoc',invoice.id);return invoice}
    if(q&&!j.agreement){requireSavedQuoteEdits(jid);toast('Customer approval is required before billing can be prepared.');go('quotedoc',jid);return null}
    if(q){toast('Open the job to review its approved billing.');go('job',jid);return null}
    if(!Array.isArray(j.lines)||!j.lines.length){toast('Add work pricing before preparing an invoice.');go('charges',jid);return null}
    const prepared=atomicState('Invoice',()=>{const lines=validatedLines(j.lines),total=sum(lines);if(total<=0)throw new Error('Add positive work pricing before preparing an invoice.');const agreement={total,scope:j.title,terms:'',lines,quoteRevision:null,quoteId:''};const invoice=createVersionedInvoice(j,agreement,'full',total,'manual',false);invoice.preparedForReview=true;log(jid,'note','Invoice No. '+invoice.num+' saved as a draft. It was not sent.','Invoice');return invoice});
    toast('Invoice prepared for review · not sent');go('invdoc',prepared.id);return prepared;
  }
  if(!q||!q.lines.length){toast('Build a quote first so the invoice has lines.');go('quote',jid);return}
  try{paymentPlanSummary(sum(q.lines),q.paymentPlan||{mode:'none'})}catch(err){toast(err.message);return}
  let invoice=invOf(jid);if(!invoice){invoice=atomicState('Invoice',()=>{const num=Math.max(1047,...S.invoices.map(v=>v.num))+1,v={id:id('i'),job:jid,quote:q.id,status:'ready',deliveryStatus:'ready',num,date:new Date().toISOString(),dueDate:'',paymentInstructions:'',scope:q.scope||j.title,terms:q.terms||'',paymentPlan:JSON.parse(JSON.stringify(q.paymentPlan||{mode:'none'})),requestStage:'deposit',payments:[],lines:JSON.parse(JSON.stringify(q.lines))};S.invoices.push(v);log(jid,'note','Invoice No. '+num+' prepared from a quote snapshot. It was not sent.','Invoice');return v});toast('Invoice prepared for review · not sent')}
  go('invdoc',invoice.id);return invoice;
}

  iedit:d=>{const v=invoiceById(d);if(!v)return;const timing=invoicePaymentTiming(v);modal(`<h2>Invoice payment details</h2><p class="help">Sending is available at any work stage. Choose when payment is due; the accepted quote stays unchanged.</p><label class="f">Payment due<select id="inv-timing"><option value="receipt" ${timing.mode==='receipt'?'selected':''}>On receipt</option><option value="completion" ${timing.mode==='completion'?'selected':''}>On completion</option><option value="date" ${timing.mode==='date'?'selected':''}>On a specific date</option></select></label><label class="f">Due date (for a specific date)<input type="date" id="inv-due" value="${esc(v.dueDate||'')}"></label><label class="f">Payment instructions<textarea id="inv-instructions" rows="4" placeholder="How the customer should pay">${esc(v.paymentInstructions||'')}</textarea></label><p class="error-box" id="inv-error" hidden></p><div class="row"><button class="btn" data-act="ieditsave" data-id="${v.id}">Save details</button><button class="btn ghost" data-act="close">Cancel</button></div>`)},
  ieditsave:d=>{try{saveInvoicePaymentDetails(d,{timing:$('#inv-timing').value,dueDate:$('#inv-due').value,paymentInstructions:$('#inv-instructions').value});closeModal();render();toast('Invoice payment details saved')}catch(err){const error=$('#inv-error');error.textContent=err.message;error.hidden=false}},

  ipay:d=>{const v=invoiceById(d);if(!v)return;const s=invoiceCollectionSummary(v);modal(`<h2>Record payment · Invoice No. ${v.num}</h2><p class="note">This records a payment received elsewhere. It does not charge a card or move money.</p><label class="f">Amount<input type="number" inputmode="decimal" min="0.01" step="0.01" id="pay-amount" value="${s.requestedNow>0?s.requestedNow.toFixed(2):s.balance.toFixed(2)}"></label><label class="f">Date received<input type="date" id="pay-date" value="${todayDate()}"></label><label class="f">Method<select id="pay-method"><option value="">Choose a method</option><option>Check</option><option>Cash</option><option>Bank transfer</option><option>Card recorded elsewhere</option><option>Other</option></select></label><p class="err" id="pay-err" hidden></p><div class="row"><button class="btn" data-act="ipaysave" data-id="${v.id}">Record payment</button><button class="btn ghost" data-act="close">Cancel</button></div>`)},
  ipaysave:d=>{try{const v=invoiceById(d),payment={amount:+$('#pay-amount').value,date:$('#pay-date').value,method:$('#pay-method').value};atomicState('Payment record',()=>{recordInvoicePayment(v,payment);log(v.job,'note','Payment recorded on invoice No. '+v.num+': '+money(payment.amount)+'.','Invoice');return v});const s=invoiceSummary(v);closeModal();render();toast(s.status==='paid'?'Paid in full · work status unchanged':'Partial payment recorded · work status unchanged')}catch(err){const e=$('#pay-err');e.textContent=err.message;e.hidden=false}},
  qb:d=>{const v=invoiceById(d),csv=invoiceCsv(v);modal(`<h2>Export invoice No. ${v.num} for accountant</h2><p class="muted">Download or copy this exact invoice CSV for manual handoff. Generating it does not send, sync, or verify a QuickBooks import.</p><pre id="csv">${esc(csv)}</pre><div class="row"><button class="btn" data-act="downloadcsv" data-id="${v.id}">Download CSV</button><button class="btn ghost" data-act="copycsv">Copy CSV</button><button class="btn ghost" data-act="close">Close</button></div>`)},
  downloadcsv:d=>{const v=invoiceById(d),blob=new Blob([invoiceCsv(v)],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='invoice-'+v.num+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('CSV downloaded · not sent')},
  copycsv:()=>{const t=$('#csv').textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#csv'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected. Copy it from here.')})},
  print:()=>window.print(),quoteprint:d=>{try{requireSavedQuoteEdits(d);window.print()}catch(err){toast(err.message)}},
  next:d=>{const j=job(d),i=STATUS.findIndex(s=>s[0]===j.status),next=STATUS[i+1]?.[0];if(!next)return;try{setJobWorkStatus(d,next);render();toast('Moved to '+SLABEL[next])}catch(err){toast(err.message)}},
  addnote:d=>{const el=$('#note-in'),text=el.value.trim();if(!text)return;try{atomicState('Job note',()=>{if(!job(d))throw new Error('Job not found. Reload and try again.');log(d,'note',text,'Note')});render()}catch(err){toast(err.message)}},
  webreq:()=>{try{const request=createServiceRequest({name:'Jordan Example',phone:'970-555-0142',email:'jordan@example.test',service:'Railings, stairs or gates',details:'Synthetic demo: deck railing inquiry, about 30 feet. Website form is not connected.',source:'Website',externalId:'demo-website-request-1'});toast('Demo website request added · no customer, quote, or job created');go('request',request.id)}catch(err){toast(err.message)}},
  retryquote:d=>{try{retryQuoteEdits(d);render();toast('Quote changes saved locally')}catch(err){render();toast(err.message)}},
  discardquote:d=>{discardQuoteEdits(d);render();toast('Unsaved quote changes discarded')},
  reset:()=>{try{atomicState('Demo reset',()=>{S=seed();migrate();syncUid();return S});quoteEditDrafts.clear();toast('Demo reset');go('today')}catch(err){toast(err.message)}},
  closeover:(d,e)=>{if(e.target.classList.contains('overlay'))closeModal()}
};
function updateVisiblePaymentSummary(q,planOverride){
  const err=$('#plan-error'),editor=quoteEditorDocument(q.job)||q;try{const s=paymentPlanSummary(sum(editor.lines),planOverride||editor.paymentPlan||{mode:'none'});if($('#plan-total'))$('#plan-total').textContent=money(s.total);if($('#plan-upfront'))$('#plan-upfront').textContent=money(s.upfront);if($('#plan-later'))$('#plan-later').textContent=money(s.later);if(err)err.hidden=true;return true}catch(error){if(err){err.textContent=error.message;err.hidden=false}return false}
}
function updateEmailReview(){const [kind,jid]=String(view.id||'').split(':');try{const p=buildEmailPreview(kind,jid,readEmailFields());$('#email-document').innerHTML=p.html;$('#email-amount').textContent=money(p.amountRequested);$('#email-preview-subject').textContent=p.subject;$('#email-preview-to').textContent=p.to||'Not set';const e=$('#email-error');if(e)e.hidden=true}catch(error){const e=$('#email-error');if(e){e.textContent=error.message;e.hidden=false}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=ACT[t.dataset.act];if(a)a(t.dataset.id,e)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.chargeLi!==undefined){const l=chargeDraft.lines[+t.dataset.chargeLi],f=t.dataset.f;l[f]=f==='desc'?t.value:(t.value===''?0:+t.value);const amount=$('#charge-amount-'+t.dataset.chargeLi),total=$('#charge-total');if(amount)amount.textContent=money(amt(l));if(total)total.textContent=money(sum(chargeDraft.lines))}
  else if(t.dataset.li!==undefined){const q=quoteEditorDocument(view.id),index=+t.dataset.li,l=q&&q.lines[index],f=t.dataset.f,value=f==='desc'?t.value:(t.value===''?0:+t.value);if(!l)return;try{const saved=updateQuoteEdits(view.id,'Quote line',candidate=>{if(!candidate.lines[index])throw new Error('Quote line not found. Reload and try again.');candidate.lines[index][f]=value});const line=saved.lines[index];$('#amt'+index).textContent=money(amt(line));$('#summary-title'+index).textContent=line.desc||KIND[line.type].n;$('#summary-detail'+index).textContent=lineSummaryText(line);$('#summary-price'+index).textContent=money(amt(line));$('#qtotal').textContent=money(sum(saved.lines));updateVisiblePaymentSummary(saved)}catch(err){render();toast(err.message)}}
  else if(t.dataset.qf){const q=quoteOf(view.id),field=t.dataset.qf;if(!q||!['scope','number','date','validUntil','terms'].includes(field))return;try{updateQuoteEdits(view.id,'Quote',candidate=>{candidate[field]=t.value})}catch(err){render();toast(err.message)}}
  else if(t.dataset.rate){try{atomicState('Rate',()=>{S.settings[t.dataset.rate]=+t.value||0;return S.settings[t.dataset.rate]})}catch(err){toast(err.message)}}
  else if(t.dataset.input==='custsearch'){view.q=t.value;$('#cust-list').innerHTML=custList(t.value)}
  else if(t.dataset.input==='quotecustomersearch'){captureQuoteDraft();$('#quote-customer-results').innerHTML=quoteCustomerRows(t.value)}
  else if(t.dataset.input==='quotedraft'){captureQuoteDraft()}
  else if(t.dataset.input==='jobcustomersearch'){captureJobDraft();$('#job-customer-results').innerHTML=jobCustomerRows(t.value)}
  else if(t.dataset.input==='jobdraft'){captureJobDraft()}
  else if(t.dataset.input==='requestdraft'){captureRequestDraft()}
  else if(t.dataset.input==='requestsearch'){requestFilters.query=t.value;const list=$('#request-list');if(list)list.innerHTML=requestListHtml()}
  else if(t.dataset.input==='customerfield'){view.form=readCustomerForm();const matches=findCustomerMatches(view.form,view.id),host=$('#customer-matches');host.innerHTML=`<b>Possible matches</b><p class="help">Review these before saving. Records are never merged automatically.</p>${matches.map(c=>`<button class="li" data-act="usecustomer" data-id="${c.id}"><span class="t"><b>${esc(c.name)}</b><span class="s">${esc(c.phone||c.email||c.type)}</span></span><span>${customerReturn?'Use customer':'Open'}</span></button>`).join('')}`;host.hidden=!matches.length}
  else if(t.dataset.input==='paymentvalue'){const q=quoteEditorDocument(view.id),current=q.paymentPlan||{mode:'none'},plan={mode:current.mode||'none',value:t.value===''?'':+t.value};try{const saved=updateQuoteEdits(view.id,'Payment plan',candidate=>{candidate.paymentPlan=plan});updateVisiblePaymentSummary(saved)}catch(err){render();toast(err.message)}}
  else if(t.dataset.input==='emaildraft'){updateEmailReview()}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.input==='quotedraft')captureQuoteDraft();
  if(t.dataset.input==='jobdraft')captureJobDraft();
  if(t.dataset.input==='customerfield'){view.form=readCustomerForm()}
  if(t.dataset.change==='customerfiles'){handleCustomerFiles(t.files);t.value=''}
  if(t.dataset.change==='boardstage'){view.stage=t.value;render()}
  if(t.dataset.change==='boardstatus'){const j=job(t.dataset.id);if(j&&j.status!==t.value){try{setJobWorkStatus(j.id,t.value);render();toast('Moved to '+SLABEL[t.value])}catch(err){render();toast(err.message)}}}
  if(t.dataset.change==='status'){const j=job(t.dataset.id);if(j&&j.status!==t.value){try{setJobWorkStatus(j.id,t.value);render()}catch(err){render();toast(err.message)}}}
  if(t.dataset.change==='paymentplan'){const plan={mode:t.value};if(t.value==='percent')plan.value=50;if(t.value==='amount')plan.value=0;try{updateQuoteEdits(view.id,'Payment plan',candidate=>{candidate.paymentPlan=plan})}catch(err){toast(err.message)}render()}
  if(t.dataset.change==='jobpath'){captureJobDraft();jobDraft.path=t.value;render()}
  if(t.dataset.change==='requeststatus'){requestFilters.status=t.value;render()}
  if(t.dataset.change==='photo'&&t.files[0]){const jid=t.dataset.id,r=new FileReader();r.onerror=()=>toast('Photo could not be read. Choose it again and retry.');r.onload=()=>{const im=new Image();im.onerror=()=>toast('Photo could not be processed. Choose a supported image and retry.');im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const dataUrl=c.toDataURL('image/jpeg',.8);try{atomicState('Photo',()=>{const current=job(jid);if(!current)throw new Error('Job not found. Reload and try again.');current.photos.push(dataUrl);log(jid,'photo','Photo added.','Photo');return current});render()}catch(err){toast(err.message)}};im.src=r.result};r.readAsDataURL(t.files[0])}
});
/* drag on the board */
let dragId=null;
document.addEventListener('dragstart',e=>{const k=e.target.closest('.kc');if(k){dragId=k.dataset.id;e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(c&&dragId){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{const c=e.target.closest('.col');if(c&&dragId){e.preventDefault();const j=job(dragId);if(j&&j.status!==c.dataset.col){try{setJobWorkStatus(j.id,c.dataset.col);toast('Moved to '+SLABEL[c.dataset.col])}catch(err){toast(err.message)}}dragId=null;render()}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('keydown',e=>{const host=$('#modal');if(!host||!host.innerHTML)return;if(e.key==='Escape'){e.preventDefault();closeModal();return}if(e.key!=='Tab')return;const sheet=host.querySelector('.sheet'),focusable=sheet?[...sheet.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(el=>!el.hidden):[];if(!focusable.length){e.preventDefault();if(sheet)sheet.focus();return}const first=focusable[0],last=focusable[focusable.length-1],active=document.activeElement;if(e.shiftKey&&(active===first||!sheet.contains(active))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(active===last||!sheet.contains(active))){e.preventDefault();first.focus()}});
function fromHash(){const h=(location.hash||'').slice(1);if(NAV.some(n=>n[0]===h)&&view.name!==h){resetCustomerFileSession();view={name:h};render()}}
window.addEventListener('hashchange',fromHash);
window.addEventListener('storage',receiveStorageUpdate);
function requestedDocumentParam(name){
  const query=String(location.search||'').replace(/^\?/,'');if(!query)return null;
  for(const part of query.split('&')){const at=part.indexOf('='),rawKey=at<0?part:part.slice(0,at);if(decodeURIComponent(rawKey.replace(/\+/g,' '))===name){const rawValue=at<0?'':part.slice(at+1);try{return decodeURIComponent(rawValue.replace(/\+/g,' '))}catch(error){return ''}}}
  return null;
}
function requestedCustomerQuote(){return requestedDocumentParam('customerQuote')}
function requestedCustomerInvoice(){return requestedDocumentParam('customerInvoice')}
function mountCustomerQuote(jobId){
  customerSurfaceActive=true;customerSurfaceKind='quote';document.title='Customer quote · Mickey T Welding & Fabrication';document.body.className='customer-surface';document.body.innerHTML=`<main class="customer-main"><div id="customer-app">${renderCustomerQuote(jobId)}</div></main>`;
}
function mountCustomerInvoice(invoiceId){customerSurfaceActive=true;customerSurfaceKind='invoice';document.title='Customer invoice · Mickey T Welding & Fabrication';document.body.className='customer-surface';document.body.innerHTML=`<main class="customer-main"><div id="customer-app">${renderCustomerInvoice(invoiceId)}</div></main>`}
const standaloneCustomerQuote=requestedCustomerQuote(),standaloneCustomerInvoice=requestedCustomerInvoice();
if(standaloneCustomerInvoice!==null)mountCustomerInvoice(standaloneCustomerInvoice);
else if(standaloneCustomerQuote!==null)mountCustomerQuote(standaloneCustomerQuote);
else{const h0=(location.hash||'').slice(1);if(NAV.some(n=>n[0]===h0))view={name:h0};render()}
</script>
